<!doctype html><html lang="en"><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Critterwave Loading Preview</title>
<script src="../assets/theme-boot.js"></script>
<link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="../css/title-screen.css">
<style>
.preview-picker { position: fixed; inset-inline: 12px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 4000; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.preview-picker button[aria-pressed="true"] { border-color: var(--highlight); }
.preview-picker[hidden] { display: none; }
</style>
<body>
<main id="title-screen" class="title-screen" aria-labelledby="title-screen-wordmark">
      <h1 id="title-screen-wordmark">Critterwave</h1>
      <button id="title-screen-play" type="button" disabled>Play</button>
      <p id="loading-critters" class="transition-status" role="status"><span class="transition-critter" aria-hidden="true">⏳</span>LOADING CRITTERS</p>
      <p id="title-screen-error" role="alert" hidden>Couldn’t load the game. Try again.</p>
    </main><p id="loading-arena" class="transition-status" role="status" hidden><span class="transition-critter" aria-hidden="true">⏳</span>ENTERING ARENA</p>
<nav class="preview-picker" aria-label="Preview loading screen">
<button class="meta-btn" id="show-critters" aria-pressed="true" type="button">Loading critters</button>
<button class="meta-btn" id="show-arena" aria-pressed="false" type="button">Entering arena</button>
</nav>
<script>
document.documentElement.removeAttribute("data-title-seen");
if (new URLSearchParams(location.search).has("clean")) { document.querySelector(".preview-picker").hidden = true; }
const title = document.querySelector("#title-screen");
const arena = document.querySelector("#loading-arena");
const crittersButton = document.querySelector("#show-critters");
const arenaButton = document.querySelector("#show-arena");
function showArena(active) {
  title.hidden = active;
  arena.hidden = !active;
  crittersButton.setAttribute("aria-pressed", String(!active));
  arenaButton.setAttribute("aria-pressed", String(active));
}
crittersButton.addEventListener("click", () => showArena(false));
arenaButton.addEventListener("click", () => showArena(true));
window.addEventListener("hashchange", () => showArena(location.hash === "#arena"));
showArena(location.hash === "#arena");
</script>
</body></html>
