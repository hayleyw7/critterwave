<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 1200px;
        height: 630px;
        font-family: "VT323", monospace;
        background: #120A1E;
        color: #f8f0ff;
        overflow: hidden;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      body::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.028) 0,
          rgba(255, 255, 255, 0.028) 1px,
          transparent 1px,
          transparent 4px
        );
        opacity: 0.42;
      }

      .frame {
        display: none;
      }

      h1 {
        position: relative;
        z-index: 1;
        display: flex;
        justify-content: space-between;
        width: min(540px, 72%);
        font-size: 74px;
        line-height: 1;
        color: #fde047;
        text-shadow:
          4px 4px 0 #854d0e,
          0 0 48px rgba(253, 224, 71, 0.45);
      }

      h1 span {
        flex: 0 0 auto;
        text-align: center;
      }

      .press-start {
        position: absolute;
        bottom: 154px;
        z-index: 2;
        color: #f8f0ff;
        font-size: 34px;
        letter-spacing: 4px;
        text-shadow: 2px 2px 0 #1a0f2e;
      }
    </style>
  </head>
  <body>
    <div class="frame" aria-hidden="true"></div>
    <h1 aria-label="Critterwave">
      <span>C</span><span>R</span><span>I</span><span>T</span><span>T</span
      ><span>E</span><span>R</span><span>W</span><span>A</span><span>V</span
      ><span>E</span>
    </h1>
    <div class="press-start">PRESS START</div>
  </body>
</html>
